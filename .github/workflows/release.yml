name: Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 1. Read version ────────────────────────────────────────────────────
      - name: Extract version from VERSION file
        id: ver
        run: |
          V="$(cat VERSION | tr -d '[:space:]')"
          if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: VERSION file does not contain a valid semver string (got: '$V')"
            exit 1
          fi
          echo "num=$V"         >> "$GITHUB_OUTPUT"
          echo "tag=v$V"        >> "$GITHUB_OUTPUT"
          echo "VERSION_NUM=$V" >> "$GITHUB_ENV"
          echo "VERSION_TAG=v$V" >> "$GITHUB_ENV"
          echo "Parsed version: $V"

      # ── 2. Stamp version into all source files ─────────────────────────────
      - name: Stamp version into source files
        run: |
          V="${VERSION_NUM}"

          # manifest.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${V}\"/" \
            custom_components/pihole_timer/manifest.json

          # __init__.py  –  both the CARD_VERSION banner constant …
          sed -i "s/^CARD_VERSION = \"[^\"]*\"/CARD_VERSION = \"${V}\"/" \
            custom_components/pihole_timer/__init__.py

          # … and any hardcoded semver strings inside the file
          sed -i "s/v[0-9]\+\.[0-9]\+\.[0-9]\+/v${V}/g" \
            custom_components/pihole_timer/__init__.py

          # Card JS files (console banner)
          sed -i "s/v[0-9]\+\.[0-9]\+\.[0-9]\+/v${V}/g" \
            custom_components/pihole_timer/www/pihole-bypass-card.js
          sed -i "s/v[0-9]\+\.[0-9]\+\.[0-9]\+/v${V}/g" \
            www/pihole-bypass-card.js

          # ── Verification ────────────────────────────────────────────────────
          echo "--- Verification ---"
          echo "VERSION file  : $(cat VERSION)"
          echo "manifest.json : $(grep '\"version\"' custom_components/pihole_timer/manifest.json)"
          echo "__init__.py   : $(grep '^CARD_VERSION' custom_components/pihole_timer/__init__.py)"
          echo "JS (component): $(grep -i 'pihole-bypass-card' custom_components/pihole_timer/www/pihole-bypass-card.js | head -1)"
          echo "JS (www)      : $(grep -i 'pihole-bypass-card' www/pihole-bypass-card.js | head -1)"

          grep -q "\"version\": \"${V}\"" custom_components/pihole_timer/manifest.json \
            || { echo "ERROR: manifest.json version mismatch"; exit 1; }
          grep -q "^CARD_VERSION = \"${V}\"" custom_components/pihole_timer/__init__.py \
            || { echo "ERROR: __init__.py CARD_VERSION mismatch"; exit 1; }
          grep -q "v${V}" custom_components/pihole_timer/www/pihole-bypass-card.js \
            || { echo "ERROR: JS (custom_components) version mismatch"; exit 1; }
          grep -q "v${V}" www/pihole-bypass-card.js \
            || { echo "ERROR: JS (www) version mismatch"; exit 1; }

          echo "All files consistently stamped with ${V}"

      # ── 3. Commit version bump back ────────────────────────────────────────
      - name: Commit version stamp
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            VERSION \
            custom_components/pihole_timer/manifest.json \
            custom_components/pihole_timer/__init__.py \
            custom_components/pihole_timer/www/pihole-bypass-card.js \
            www/pihole-bypass-card.js
          if git diff --cached --quiet; then
            echo "Nothing to commit (all files already at ${VERSION_NUM})"
          else
            git commit -m "chore: stamp version ${VERSION_NUM} [skip ci]"
            DEFAULT_BRANCH="$(git remote show origin | awk '/HEAD branch/{print $NF}')"
            git push origin "HEAD:${DEFAULT_BRANCH}"
            echo "Version commit pushed to ${DEFAULT_BRANCH}"
          fi

      # ── 4. Build zip ───────────────────────────────────────────────────────
      - name: Build release zip
        run: |
          zip -r "pihole-bypass-${VERSION_TAG}.zip" \
            custom_components/ \
            www/ \
            icon.png \
            dark_icon.png \
            VERSION \
            README.md \
            hacs.json \
            -x "*.pyc" \
            -x "*/__pycache__/*" \
            -x "*/.git/*"

      # ── 5. Create GitHub Release + attach zip ─────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "PiHole Bypass ${{ steps.ver.outputs.tag }}"
          files: pihole-bypass-${{ steps.ver.outputs.tag }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
